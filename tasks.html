<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TodoFlow | Tasks</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <!-- ======================
SIDEBAR
====================== -->

    <aside class="sidebar">


        <div class="logo">
            <h2>✅ TodoFlow</h2>
        </div>

        <nav>

            <a href="index.html">Dashboard</a>

            <a class="active" href="tasks.html">Tasks</a>

            <a href="add-task.html">Add Task</a>

            <a href="calendar.html">Calendar</a>

            <a href="settings.html">Settings</a>

        </nav>

    </aside>



    <!-- ======================
MAIN
====================== -->

    <div class="main">

        <header>

            <h1>

                All Tasks

            </h1>

            <button id="themeToggle">

                🌙

            </button>


        </header>


        <!-- ======================
SEARCH
====================== -->

        <section class="search-section">

            <input type="text" id="searchInput" placeholder="Search task title or description...">

        </section>


        <!-- ======================
FILTERS

====================== -->

        <section class="filters">

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="completed">
                Completed
            </button>

            <button class="filter-btn" data-filter="pending">
                Pending
            </button>

            <button class="filter-btn" data-filter="high">

                High Priority
            </button>

            <button class="filter-btn" data-filter="today">
                Due Today
            </button>

            <button class="filter-btn" data-filter="overdue">
                Overdue
            </button>

        </section>


        <!-- ======================
SORTING
====================== -->

        <section class="sorting">


            <select id="sortTasks">

                <option value="newest">
                    Newest
                </option>

                <option value="oldest">
                    Oldest
                </option>

                <option value="alphabetical">
                    Alphabetical
                </option>

                <option value="priority">
                    Priority
                </option>

                <option value="date">
                    Due Date

                </option>

            </select>

        </section>


        <!-- ======================
TASK LIST
====================== -->

        <section id="taskContainer" class="task-container">

            <!-- JS inserts cards here -->

        </section>


        <!-- ======================
EMPTY STATE

====================== -->

        <section id="emptyState" class="empty-state">

            <h2>

                📭

            </h2>

            <h3>

                No Tasks Found

            </h3>

            <p>

                Create your first task to get started.

            </p>

            <a href="add-task.html">

                <button>

                    ➕ Add Task

                </button>

            </a>

        </section>


    </div>

    <!-- ==================================
EDIT TASK MODAL
=================================== 

-->

    <div class="modal" id="editModal">

        <div class="modal-content">

            <span class="close">

                &times;

            </span>

            <h2>

                Edit Task

            </h2>

            <form id="editTaskForm">

                <input type="text" id="editTitle" placeholder="Task Title">

                <textarea id="editDescription" placeholder="Description">
</textarea>

                <select id="editCategory">

                    <option>📚 School</option>

                    <option>💼 Work</option>

                    <option>🏠 Home</option>

                    <option>🛒 Shopping</option>

                    <option>💪 Fitness</option>

                    <option>🎮 Gaming</option>

                </select>

                <input type="date" id="editDate">

                <input type="time" id="editTime">

                <select id="editPriority">

                    <option>Low</option>

                    <option>Medium</option>

                    <option>High</option>

                </select>

                <input type="color" id="editColor">

                <input type="text" id="editEmoji" placeholder="Emoji">

                <div class="modal-buttons">

                    <button type="submit">

                        Save Changes

                    </button>

                    <button type="button" id="cancelEdit">

                        Cancel

                    </button>

                </div>

            </form>


        </div>

    </div>


    <!-- ==================================
DELETE MODAL
=================================== -->

    <div class="modal" id="deleteModal">

        <div class="modal-content">

            <h2>

                Delete Task

            </h2>


            <p>

                Are you sure you want to delete this task?

            </p>

            <div class="modal-buttons">

                <button id="confirmDelete">

                    Delete

                </button>

                <button id="cancelDelete">

                    Cancel

                </button>

            </div>

        </div>

    </div>


    <!-- ======================
TOAST
====================== -->

    <div id="toastContainer"></div>


    <!-- ======================
JAVASCRIPT
====================== -->

    <script src="storage.js"></script>

    <script src="tasks.js"></script>


    <script src="filter.js"></script>

    <script src="search.js"></script>

    <script src="sort.js"></script>

    <script src="modal.js"></script>

    <script src="theme.js"></script>

    <script src="toast.js"></script>

    <script src="script.js"></script>

</body>

</html>
